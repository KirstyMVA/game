  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const canvas = document.getElementById("game-canvas");
      const ctx = canvas.getContext("2d");
      const scoreValue = document.getElementById("score-value");
      const signalValue = document.getElementById("signal-value");
      const message = document.getElementById("live-message");
      const overlay = document.getElementById("game-overlay");
      const questionOverlay = document.getElementById("question-overlay");
      const questionPrompt = document.getElementById("question-prompt");
      const questionOptions = document.getElementById("question-options");
      const restartButton = document.getElementById("restart-button");
      const scoreForm = document.getElementById("score-form");
      const playerName = document.getElementById("player-name");
      const saveScoreButton = scoreForm.querySelector("button");
      const scoreStatus = document.getElementById("score-status");
      const leaderboardList = document.getElementById("leaderboard-list");
      let leaderboardRecords = [];

      function renderLeaderboard(records) {
        leaderboardRecords = [...records].sort((a, b) => Number(b.score || 0) - Number(a.score || 0)).slice(0, 5);
        leaderboardList.innerHTML = leaderboardRecords.length ? leaderboardRecords.map((record, index) => `<li class="flex items-center justify-between rounded-lg border border-cyan-100/10 bg-cyan-100/5 px-3 py-2 text-sm"><span><span class="mono mr-2 text-cyan-300">${index + 1}</span>${escapeHtml(record.player_name)}</span><strong class="mono text-cyan-100">${Number(record.score || 0).toString().padStart(3, "0")}</strong></li>`).join("") : `<li class="text-sm text-cyan-100/60">No scores saved yet.</li>`;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[character]));
      }

      const dataHandler = { onDataChanged(data) { renderLeaderboard(data); } };
      window.dataSdk.init(dataHandler).then(result => {
        if (!result.isOk) scoreStatus.textContent = "Leaderboard unavailable right now.";
      });

      scoreForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const name = playerName.value.trim();
        if (!name) return;
        saveScoreButton.disabled = true;
        scoreStatus.textContent = "Saving score…";
        try {
          const result = await window.dataSdk.create({ player_name: name, score, created_at: new Date().toISOString() });
          scoreStatus.textContent = result.isOk ? "Score saved to the leaderboard." : "Could not confirm the score. Try again.";
          if (result.isOk) playerName.value = "";
        } finally {
          saveScoreButton.disabled = false;
        }
      });

      const channelChecks = [
        { prompt: "A quick clarification is needed from a colleague who is online now. Which channel fits best?", options: ["Instant message (IM)", "Email", "Phone call"], answer: 0 },
        { prompt: "You need to share a detailed project update that people may need to reference later. Which channel fits best?", options: ["Phone call", "Email", "IM only"], answer: 1 },
        { prompt: "A production issue needs an immediate two-way discussion. Which channel fits best?", options: ["Phone or video call", "A long email", "A delayed announcement"], answer: 0 },
        { prompt: "Your message could sound abrupt: ‘Send this now.’ Which rewrite has the most constructive tone?", options: ["Please could you send this when you have a moment? Thanks.", "Send this now.", "Why have you not sent this yet?"], answer: 0 },
        { prompt: "You disagree with a proposal in a team chat. Which response has the best tone?", options: ["I see the goal. Could we also consider this alternative?", "That will never work.", "No."], answer: 0 },
        { prompt: "A sensitive performance concern needs nuance and privacy. Which channel is most appropriate?", options: ["Public group chat", "Private conversation or call", "All-company email"], answer: 1 }
      ];
      let checkIndex = 0;
      let awaitingCheck = false;

      const tiles = 20;
      const cell = canvas.width / tiles;
      let snake;
      let node;
      let direction;
      let nextDirection;
      let score;
      let gameOver;
      let timer;
      let touchStart = null;

      function randomNode() {
        let candidate;
        do {
          candidate = {
            x: Math.floor(Math.random() * tiles),
            y: Math.floor(Math.random() * tiles)
          };
        } while (snake.some(segment => segment.x === candidate.x && segment.y === candidate.y));
        return candidate;
      }

      function showChannelCheck() {
        const check = channelChecks[checkIndex % channelChecks.length];
        questionPrompt.textContent = check.prompt;
        questionOptions.innerHTML = "";
        check.options.forEach((option, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "question-option";
          button.textContent = option;
          button.addEventListener("click", () => {
            const correct = index === check.answer;
            message.textContent = correct ? "Channel choice noted. Keep the conversation moving." : "Good reflection. Choose the channel that best matches the urgency and tone.";
            questionOverlay.classList.remove("show");
            awaitingCheck = false;
            checkIndex += 1;
            timer = setInterval(tick, 118);
            canvas.focus({ preventScroll: true });
          });
          questionOptions.appendChild(button);
        });
        questionOverlay.classList.add("show");
        awaitingCheck = true;
      }

      function startGame() {
        clearInterval(timer);
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        node = { x: 15, y: 5 };
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        gameOver = false;
        overlay.classList.remove("show");
        scoreValue.textContent = "000";
        signalValue.textContent = "ACTIVE";
        message.textContent = "Signal is moving. Keep the channel open.";
        draw();
        timer = setInterval(tick, 118);
        canvas.focus({ preventScroll: true });
      }

      function tick() {
        if (gameOver || awaitingCheck) return;

        direction = nextDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };

        const hitBoundary = head.x < 0 || head.x >= tiles || head.y < 0 || head.y >= tiles;
        const hitTrail = snake.some(segment => segment.x === head.x && segment.y === head.y);

        if (hitBoundary || hitTrail) {
          endGame();
          return;
        }

        snake.unshift(head);

        if (head.x === node.x && head.y === node.y) {
          score += 10;
          scoreValue.textContent = String(score).padStart(3, "0");
          message.textContent = "Message node received. Choose the best workplace channel.";
          node = randomNode();
          clearInterval(timer);
          showChannelCheck();
        } else {
          snake.pop();
        }

        draw();
      }

      function endGame() {
        gameOver = true;
        clearInterval(timer);
        signalValue.textContent = "OFFLINE";
        message.textContent = "Transmission interrupted. Restart to open a new channel.";
        overlay.classList.add("show");
        draw();
      }

      function drawGrid() {
        ctx.strokeStyle = "rgba(126, 234, 255, 0.09)";
        ctx.lineWidth = 1;
        for (let i = 0; i <= tiles; i++) {
          const position = i * cell;
          ctx.beginPath();
          ctx.moveTo(position, 0);
          ctx.lineTo(position, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, position);
          ctx.lineTo(canvas.width, position);
          ctx.stroke();
        }
      }

      function drawNode() {
        const x = node.x * cell + cell / 2;
        const y = node.y * cell + cell / 2;
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ff745f";
        ctx.fillStyle = "#ff745f";
        ctx.beginPath();
        ctx.arc(x, y, cell * 0.27, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff1ed";
        ctx.beginPath();
        ctx.arc(x, y, cell * 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSnake() {
        snake.forEach((segment, index) => {
          const inset = index === 0 ? 3 : 4;
          const x = segment.x * cell + inset;
          const y = segment.y * cell + inset;
          const size = cell - inset * 2;

          ctx.save();
          if (index === 0) {
            ctx.shadowBlur = 18;
            ctx.shadowColor = "#76edff";
            ctx.fillStyle = "#dffbff";
          } else {
            ctx.fillStyle = index % 2 === 0 ? "#46cce0" : "#2ca7bd";
          }
          ctx.beginPath();
          ctx.roundRect(x, y, size, size, 5);
          ctx.fill();
          ctx.restore();

          if (index === 0) {
            ctx.fillStyle = "#07333f";
            const eyeOffsetX = direction.x === 0 ? cell * 0.27 : direction.x > 0 ? cell * 0.66 : cell * 0.28;
            const eyeOffsetY = direction.y === 0 ? cell * 0.3 : direction.y > 0 ? cell * 0.66 : cell * 0.28;
            ctx.beginPath();
            ctx.arc(segment.x * cell + eyeOffsetX, segment.y * cell + eyeOffsetY, 2.2, 0, Math.PI * 2);
            ctx.fill();
            if (direction.x === 0) {
              ctx.beginPath();
              ctx.arc(segment.x * cell + cell * 0.67, segment.y * cell + eyeOffsetY, 2.2, 0, Math.PI * 2);
              ctx.fill();
            }
            if (direction.y === 0) {
              ctx.beginPath();
              ctx.arc(segment.x * cell + eyeOffsetX, segment.y * cell + cell * 0.67, 2.2, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#071923";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        drawNode();
        drawSnake();
      }

      function setDirection(x, y) {
        if (gameOver) return;
        if (x === -direction.x && y === -direction.y) return;
        nextDirection = { x, y };
      }

      document.addEventListener("keydown", (event) => {
        const keys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d", "W", "A", "S", "D"];
        if (keys.includes(event.key)) event.preventDefault();

        if (event.key === "ArrowUp" || event.key === "w" || event.key === "W") setDirection(0, -1);
        if (event.key === "ArrowDown" || event.key === "s" || event.key === "S") setDirection(0, 1);
        if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") setDirection(-1, 0);
        if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") setDirection(1, 0);
      });

      canvas.addEventListener("pointerdown", (event) => {
        touchStart = { x: event.clientX, y: event.clientY };
      });

      canvas.addEventListener("pointerup", (event) => {
        if (!touchStart) return;
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;

        if (Math.abs(dx) > Math.abs(dy)) {
          setDirection(dx > 0 ? 1 : -1, 0);
        } else {
          setDirection(0, dy > 0 ? 1 : -1);
        }
      });

      restartButton.addEventListener("click", startGame);
      startGame();
    });
  </script>
 </body>
</html>
